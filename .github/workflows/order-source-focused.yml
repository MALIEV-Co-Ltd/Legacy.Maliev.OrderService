name: Focused Order source acceptance

on:
  pull_request:
    branches: [main, develop, staging]
    paths:
      - "Legacy.Maliev.OrderService.Application/**"
      - "Legacy.Maliev.OrderService.Data/**"
      - "Legacy.Maliev.OrderService.Tests/**"
      - ".github/workflows/order-source-focused.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    env:
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      VSTestCollect: XPlat Code Coverage
      VSTestLogger: trx
      VSTestResultsDirectory: ${{ github.workspace }}/focused-results
      VSTestTestCaseFilter: FullyQualifiedName~OrderCalendarTurnaroundHttpTests|FullyQualifiedName~OrderFileMetadataLifecycleHttpTests|FullyQualifiedName~OrderOpenApiHttpContractTests|FullyQualifiedName~OrderCatalogLifecycleHttpTests|FullyQualifiedName~OrderPrimitiveTextHttpTests|FullyQualifiedName~OrderOriginalInputHttpTests|FullyQualifiedName~OrderSourceBodyBoundaryTests|FullyQualifiedName~OrderCatalogOriginalNullControllerTests|FullyQualifiedName~OrderFileHistoryOriginalNullControllerTests|FullyQualifiedName~OrderFileCreateOriginalResponseTests|FullyQualifiedName~OrderFileCreateMissingParentHttpTests|FullyQualifiedName~LegacyOrderHealthHttpTests|FullyQualifiedName~OrderHistoryReadSourceHttpTests|FullyQualifiedName~OrderStatusReadSourceHttpTests|FullyQualifiedName~OrderLatestStatusReadSourceHttpTests|FullyQualifiedName~ProcessReadSourceHttpTests|FullyQualifiedName~OrderProcessScalarStringHttpTests|FullyQualifiedName~CatalogResponseSourceHttpTests|FullyQualifiedName~OrderCategoryScalarStringHttpTests|FullyQualifiedName~CatalogCreateResponseSourceHttpTests|FullyQualifiedName~FileFormatResponseWireContractTests|FullyQualifiedName~OrderFileResponseSourceHttpTests|FullyQualifiedName~OrderReadResponseSourceHttpTests|FullyQualifiedName~OrderMasterQuerySourceHttpTests|FullyQualifiedName~OrderHistoryCreateResponseSourceHttpTests|FullyQualifiedName~OrderCreateResponseSourceHttpTests|FullyQualifiedName~OrderControllerContractTests|FullyQualifiedName~OrderCreatePrecisionSourceHttpTests|FullyQualifiedName~OrderDeleteSourceHttpTests|FullyQualifiedName~OrderHistoryPutReadSourceHttpTests|FullyQualifiedName~OrderHistoryPutHttpParityTests|FullyQualifiedName~ProcessReclassificationSourceHttpTests|FullyQualifiedName~OrderTrackingBoundarySourceTests|FullyQualifiedName~OrderTrackingSourceMigrationTests|FullyQualifiedName~OrderTextPhysicalPaddingSourceTests
    steps:
      - name: Check out OrderService
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out Legacy.Maliev.ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: 173d63218d9142b34075bca87f5c6d933bcbdfb6
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out Legacy.Maliev.CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: fe17b8cea8ace3eef5434f8b29c9038f5c975613
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Validate .NET solution
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/dotnet-validate@e3a6093324a24968876782153286f52db8b29fd8
        with:
          solution: Legacy.Maliev.OrderService.Tests/Legacy.Maliev.OrderService.Tests.csproj
          dotnet-version: '11.0.100'
          use-local-maliev-dependencies: 'true'
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: order-source-focused-${{ github.sha }}
          path: focused-results
          if-no-files-found: warn
          retention-days: 7
